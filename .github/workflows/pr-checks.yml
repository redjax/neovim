############################################################
# PR validation pipeline.                                  #
#                                                          #
# Runs on every PR targeting main.                         #
#                                                          #
# renovate-gate is the single required PR check. It is the #
# fan-in point for PR validation checks.                   #
#                                                          #
# Renovate needs a status check to enable auto-merge PRs.  #
############################################################

name: PR checks

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened

permissions:
  contents: read

jobs:
  renovate-gate:
    name: Renovate gate
    runs-on: ubuntu-latest

    steps:
      - name: Pass gate
        run: |
          echo "No PR validation checks are currently configured."
          echo "Renovate gate passed."

