---
############################################################
# PR validation pipeline.                                  #
#                                                          #
# Runs on every PR targeting main.                         #
#                                                          #
# Renovate gate is the single required PR check. It is the #
# fan-in point for PR validation checks.                   #
#                                                          #
# Lua and Bash validation run for relevant changes.        #
# Lua findings remain advisory. Bash findings block.       #
# Tool and execution errors block the gate.                #
############################################################

name: PR checks

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened

permissions:
  contents: read

jobs:
  changes:
    name: Detect relevant changes
    runs-on: ubuntu-latest

    permissions:
      contents: read
      pull-requests: read

    outputs:
      lua: ${{ steps.filter.outputs.lua }}
      bash: ${{ steps.filter.outputs.bash }}

    steps:
      - name: Detect validation-related changes
        id: filter
        uses: dorny/paths-filter@0e4a8c6effa4802afeda77dc8d303f8176d7dfad # v3
        with:
          filters: |
            lua:
              - '**/*.lua'
              - '.luacheckrc'
              - '.stylua.toml'
              - 'stylua.toml'
              - 'scripts/quality/check-lua.sh'
              - '.github/workflows/validate-lua.yml'
              - '.github/workflows/pr-checks.yml'

            bash:
              - '**/*.sh'
              - '**/*.bash'
              - '**/*.bats'
              - '**/.shellcheckrc'
              - '**/.editorconfig'
              - 'config/shfmt-options.txt'
              - '.github/workflows/validate-bash.yml'
              - '.github/workflows/pr-checks.yml'

  lua-validation:
    name: Validate Lua
    needs:
      - changes
    if: ${{ needs.changes.outputs.lua == 'true' }}

    uses: ./.github/workflows/validate-lua.yml

    with:
      lint: true
      format: true

      use-lint-cache: true
      fix: false

      lint-fail-on-findings: false
      format-fail-on-findings: false

  bash-validation:
    name: Validate Bash
    needs:
      - changes
    if: ${{ needs.changes.outputs.bash == 'true' }}

    uses: ./.github/workflows/validate-bash.yml

    with:
      lint: true
      format: true

      fix: false

      # ShellCheck findings and formatting differences block.
      lint-fail-on-findings: true
      format-fail-on-findings: true

  renovate-gate:
    name: Renovate gate
    runs-on: ubuntu-latest

    needs:
      - changes
      - lua-validation
      - bash-validation

    # Evaluate results after failures and intentional skips.
    if: ${{ always() }}

    steps:
      - name: Check PR validation results
        shell: bash
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}

          LUA_CHANGED: ${{ needs.changes.outputs.lua }}
          LUA_RESULT: ${{ needs.lua-validation.result }}

          BASH_CHANGED: ${{ needs.changes.outputs.bash }}
          BASH_RESULT: ${{ needs.bash-validation.result }}
        run: |
          set -euo pipefail

          echo "Change detection result: $CHANGES_RESULT"
          echo "Lua-related changes: $LUA_CHANGED"
          echo "Lua validation result: $LUA_RESULT"
          echo "Bash-related changes: $BASH_CHANGED"
          echo "Bash validation result: $BASH_RESULT"

          if [[ "$CHANGES_RESULT" != "success" ]]; then
            echo "::error::Change detection failed or was cancelled."
            exit 1
          fi

          check_validation() {
            local name="$1"
            local required="$2"
            local result="$3"

            case "$required" in
              true)
                if [[ "$result" != "success" ]]; then
                  echo "::error::$name validation was required but did not succeed: $result"
                  return 1
                fi

                echo "$name validation passed."
                ;;
              false)
                case "$result" in
                  success | skipped)
                    echo "$name validation was not required."
                    ;;
                  *)
                    echo "::error::Unexpected $name validation result: $result"
                    return 1
                    ;;
                esac
                ;;
              *)
                echo "::error::Missing or invalid change-detection output for $name."
                return 1
                ;;
            esac
          }

          failed=0

          check_validation \
            "Lua" \
            "$LUA_CHANGED" \
            "$LUA_RESULT" || failed=1

          check_validation \
            "Bash" \
            "$BASH_CHANGED" \
            "$BASH_RESULT" || failed=1

          if [[ "$failed" -ne 0 ]]; then
            exit 1
          fi

          echo "All required PR checks passed."
