############################################################
# PR validation pipeline.                                  #
#                                                          #
# Runs on every PR targeting main.                         #
#                                                          #
# Renovate gate is the single required PR check. It is the #
# fan-in point for PR validation checks.                   #
#                                                          #
# Lua validation runs only when relevant files change.     #
# Warnings remain visible but do not block the gate.       #
# Errors and execution failures block the gate.            #
############################################################

name: PR checks

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened

permissions:
  contents: read

jobs:
  changes:
    name: Detect relevant changes
    runs-on: ubuntu-latest

    permissions:
      contents: read
      pull-requests: read

    outputs:
      lua: ${{ steps.filter.outputs.lua }}

    steps:
      - name: Detect Lua-related changes
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            lua:
              - '**/*.lua'
              - '.luacheckrc'
              - '.stylua.toml'
              - 'stylua.toml'
              - '.github/workflows/pr-checks.yml'

  lua-validation:
    name: Validate Lua
    needs:
      - changes
    if: ${{ needs.changes.outputs.lua == 'true' }}

    uses: redjax/PipelineTemplates/.github/workflows/validate-lua.yml@feat/lua-lint

    with:
      templates-ref: feat/lua-lint

      paths: "."

      lint: true
      format: true

      lint-settings-file: .luacheckrc
      format-settings-file: .stylua.toml

      ## false=warnings do not stop pipeline
      lint-fail-on-findings: false

      ## Formatting differences remain advisory.
      format-fail-on-findings: false
      fix: false

      use-cache: true

      lint-artifact-name: neovim-pr-lua-lint-results
      format-artifact-name: neovim-pr-lua-format-results
      artifact-retention-days: 7

  renovate-gate:
    name: Renovate gate
    runs-on: ubuntu-latest

    needs:
      - changes
      - lua-validation

    ## Evaluate results even when validation failed or was skipped.
    if: ${{ always() }}

    steps:
      - name: Check PR validation results
        shell: bash
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          LUA_CHANGED: ${{ needs.changes.outputs.lua }}
          LUA_RESULT: ${{ needs.lua-validation.result }}
        run: |
          set -euo pipefail

          echo "Change detection result: $CHANGES_RESULT"
          echo "Lua-related changes: $LUA_CHANGED"
          echo "Lua validation result: $LUA_RESULT"

          if [[ "$CHANGES_RESULT" != "success" ]]; then
            echo "::error::Change detection failed or was cancelled."
            exit 1
          fi

          case "$LUA_CHANGED" in
            true)
              if [[ "$LUA_RESULT" != "success" ]]; then
                echo "::error::Lua validation was required but did not succeed: $LUA_RESULT"
                exit 1
              fi

              echo "Lua validation passed."
              ;;
            false)
              if [[ "$LUA_RESULT" != "skipped" && "$LUA_RESULT" != "success" ]]; then
                echo "::error::Unexpected Lua validation result: $LUA_RESULT"
                exit 1
              fi

              echo "No Lua-related changes. Lua validation was not required."
              ;;
            *)
              echo "::error::Change detection returned an invalid or missing Lua result."
              exit 1
              ;;
          esac

          echo "All required PR checks passed."
