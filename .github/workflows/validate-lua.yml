---
############################################################
# Lua validation.                                          #
#                                                          #
# Supports manual runs and reusable workflow calls.        #
# Executes the consuming repository's standalone scripts.  #
#                                                          #
# Fix mode changes the runner checkout and uploads reports #
# and patches. No commits or pushes are performed.         #
############################################################

name: Validate Lua

on:
  workflow_dispatch:
    inputs:
      lint:
        description: Run Luacheck.
        type: boolean
        required: false
        default: true

      format:
        description: Run StyLua.
        type: boolean
        required: false
        default: true

      use-lint-cache:
        description: Enable Luacheck's analysis cache.
        type: boolean
        required: false
        default: true

      fix:
        description: Apply formatting fixes in the runner.
        type: boolean
        required: false
        default: false

      lint-fail-on-findings:
        description: Fail on lint warnings.
        type: boolean
        required: false
        default: true

      format-fail-on-findings:
        description: Fail on formatting differences in check mode.
        type: boolean
        required: false
        default: false

  workflow_call:
    inputs:
      lint:
        description: Run Luacheck.
        type: boolean
        required: false
        default: true

      format:
        description: Run StyLua.
        type: boolean
        required: false
        default: true

      use-lint-cache:
        description: Enable Luacheck's analysis cache.
        type: boolean
        required: false
        default: true

      fix:
        description: Apply formatting fixes in the runner.
        type: boolean
        required: false
        default: false

      lint-fail-on-findings:
        description: Fail on lint warnings.
        type: boolean
        required: false
        default: true

      format-fail-on-findings:
        description: Fail on formatting differences in check mode.
        type: boolean
        required: false
        default: true

permissions:
  contents: read

jobs:
  validate:
    name: Validate Lua
    if: ${{ inputs.lint || inputs.format }}
    runs-on: ubuntu-latest

    env:
      LUACHECK_VERSION: "1.2.0"
      STYLUA_VERSION: "2.6.0"

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Verify local validation script
        shell: bash
        run: |
          set -euo pipefail
          test -f scripts/quality/check-lua.sh

      - name: Install Luacheck
        if: ${{ inputs.lint }}
        shell: bash
        run: |
          set -euo pipefail

          sudo apt-get update
          sudo apt-get install --yes \
            lua5.4 \
            liblua5.4-dev \
            luarocks

          sudo luarocks \
            --lua-version=5.4 \
            install luacheck "$LUACHECK_VERSION"

          luacheck --version

      - name: Install StyLua
        if: ${{ inputs.format }}
        shell: bash
        run: |
          set -euo pipefail

          install_dir="$RUNNER_TEMP/stylua-bin"
          archive="$RUNNER_TEMP/stylua.zip"

          mkdir -p "$install_dir"

          curl \
            --fail \
            --silent \
            --show-error \
            --location \
            --retry 3 \
            "https://github.com/JohnnyMorganz/StyLua/releases/download/v${STYLUA_VERSION}/stylua-linux-x86_64.zip" \
            --output "$archive"

          unzip -o "$archive" -d "$install_dir"
          chmod +x "$install_dir/stylua"

          echo "$install_dir" >>"$GITHUB_PATH"
          "$install_dir/stylua" --version

      - name: Run Lua validation
        shell: bash
        env:
          ROOT: ${{ github.workspace }}

          LINT: ${{ inputs.lint }}
          FORMAT: ${{ inputs.format }}
          USE_LINT_CACHE: ${{ inputs['use-lint-cache'] }}
          FIX: ${{ inputs.fix }}

          LINT_FAIL_ON_FINDINGS: ${{ inputs['lint-fail-on-findings'] }}
          FORMAT_FAIL_ON_FINDINGS: ${{ inputs['format-fail-on-findings'] }}

          SHOW_DIFF: "false"
          DIFF_PREVIEW_LINES: "30"
        run: |
          set -euo pipefail

          export REPORT_DIR="$RUNNER_TEMP/lua-validation"

          bash scripts/quality/check-lua.sh

      - name: Upload Lua reports and patches
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: lua-validation-results
          path: ${{ runner.temp }}/lua-validation/
          if-no-files-found: ignore
          retention-days: 7
